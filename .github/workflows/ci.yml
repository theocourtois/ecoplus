name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install github.com/goreleaser/goreleaser/v2@v2.20.3
      - name: Tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Format
        run: make fmt && git diff --exit-code
      - run: make lint
      - run: make nocomment
      - name: Test
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Coverage gates
        run: |
          go test -count=1 -coverprofile=domain.out ./internal/fleet ./internal/labels
          go tool cover -func=domain.out | awk '/^total:/ {sub("%","",$3); if ($3+0 < 95) {print "domain coverage " $3 " < 95"; exit 1}}'
          go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); if ($3+0 < 80) {print "total coverage " $3 " < 80"; exit 1}}'
      - run: make build
      - run: goreleaser check
      - name: Docs
        run: make docs && git diff --exit-code docs
